<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ujian Siswa</title>
  
  <!-- Memuat Tailwind CSS untuk desain modern dan responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Memuat Google Fonts (Inter) untuk tipografi yang profesional dan bersih -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Konfigurasi font utama */
    body { 
        font-family: 'Inter', sans-serif; 
    }
    
    /* Background elegan, menarik, dan profesional dengan pola samar */
    .bg-elegant {
        background-color: #f8fafc;
        background-image: 
          radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.6) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(241, 245, 249, 0.8) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(226, 232, 240, 0.7) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(204, 251, 241, 0.4) 0px, transparent 50%),
          url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%2394a3b8' fill-opacity='0.08' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3C/g%3E%3C/svg%3E");
        background-attachment: fixed;
        min-height: 100vh;
    }

    /* Kustomisasi scrollbar agar lebih rapi */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #f1f5f9; 
    }
    ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
    }

    /* Penyesuaian radio & checkbox bawaan agar sejalan dengan teks */
    .input-radio-checkbox {
        min-width: 1rem;
        min-height: 1rem;
        margin-top: 0.25rem; /* Menjaga posisi tetap di atas jika teks multibaris */
        cursor: pointer;
    }
  </style>
</head>
<body class="bg-elegant text-slate-800 py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-3xl mx-auto space-y-6">
      
    <!-- Bagian Judul Ujian -->
    <div class="text-center space-y-3 mb-10 mt-4">
      <div class="inline-flex items-center justify-center p-3.5 rounded-full bg-white/80 shadow-sm border border-slate-100 mb-2 backdrop-blur-sm">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">Portal Ujian Digital</h1>
      <p class="text-slate-600 font-medium text-lg">Silakan isi identitas dan kerjakan soal dengan teliti.</p>
    </div>

    <!-- Kartu Identitas Siswa -->
    <div class="bg-white/90 backdrop-blur-sm p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/60 mb-6">
      <h2 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2 border-b border-slate-100 pb-3">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        Identitas Peserta
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-slate-700">Nama Lengkap <span class="text-red-500">*</span></label>
          <input type="text" id="namaSiswa" placeholder="Masukkan nama lengkap Anda" required
                 class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none shadow-sm text-slate-800">
        </div>
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-slate-700">Kelas <span class="text-red-500">*</span></label>
          <input type="text" id="kelasSiswa" placeholder="Contoh: 7A" required
                 class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none shadow-sm text-slate-800">
        </div>
      </div>
    </div>

    <!-- Area Soal (Akan diisi oleh JavaScript) -->
    <div id="area-soal" class="space-y-6">
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
        <p class="text-slate-500 font-medium animate-pulse">Sedang memuat soal dari server...</p>
      </div>
    </div>

    <!-- Tombol Kirim -->
    <button id="btnKirim" onclick="kirimJawaban()" style="display: none;"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 focus:ring-4 focus:ring-blue-200 outline-none">
      Kirim Jawaban Sekarang
    </button>
    
  </div>

  <script>
    // ⚠️ GANTI DENGAN URL WEB APP YANG SAMA DENGAN DASHBOARD GURU
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCAzJwOtG9fhFdyyniJaZbK0UWM3B4Z08iWuENq8iNzlly8w8Zy7_hIzy8t-aQ3qQg/exec'; 
    let daftarSoalGlobal = [];

    // Mengambil soal saat halaman pertama kali dibuka
    window.onload = async function() {
      try {
        const response = await fetch(SCRIPT_URL + '?action=ambil_soal');
        const data = await response.json();
        daftarSoalGlobal = data;
        renderSoal(data);
      } catch (error) {
        document.getElementById('area-soal').innerHTML = `
          <div class="bg-red-50 p-6 rounded-2xl border border-red-100 text-center">
            <svg class="w-12 h-12 text-red-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h3 class="text-red-800 font-semibold mb-1">Gagal Memuat Soal</h3>
            <p class="text-red-600 text-sm">Periksa koneksi internet atau pastikan URL Web App sudah benar.</p>
          </div>`;
      }
    }

    // Fungsi untuk mencetak soal ke layar HTML dengan presisi layout
    function renderSoal(daftarSoal) {
      const area = document.getElementById('area-soal');
      area.innerHTML = ''; // Bersihkan tulisan loading

      if(daftarSoal.length === 0) {
        area.innerHTML = `
          <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center">
            <p class="text-slate-500 font-medium">Belum ada soal ujian yang tersedia untuk saat ini.</p>
          </div>`;
        return;
      }

      daftarSoal.forEach((soal, index) => {
        // Kontainer kartu soal
        let html = `
          <div class="bg-white/95 backdrop-blur-sm p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/60 soal-item transition-all hover:shadow-md" data-id="${soal.idSoal}" data-tipe="${soal.tipeSoal}">
            
            <!-- Flexbox untuk menyelaraskan nomor dan teks soal jika teksnya panjang -->
            <div class="flex items-start mb-6">
              <span class="font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg mr-4 text-lg leading-none border border-blue-100 shadow-sm min-w-[3rem] text-center flex-shrink-0">${index + 1}</span>
              <div class="font-medium text-slate-800 text-base text-justify leading-relaxed flex-1 pt-0.5 whitespace-pre-wrap break-words">
                ${soal.teksSoal}
              </div>
            </div>
            
            <div class="soal-container pl-0 sm:pl-16 space-y-3">`;

        if (soal.tipeSoal === 'Pilihan Ganda') {
          soal.dataJawaban.forEach((opsi, i) => {
            html += `
              <label class="flex items-start p-4 bg-slate-50/50 hover:bg-blue-50/80 border border-slate-200 hover:border-blue-300 rounded-xl cursor-pointer transition-all group shadow-sm">
                <input type="radio" name="${soal.idSoal}" value="${opsi.teks}" class="input-radio-checkbox text-blue-600 focus:ring-blue-500 mt-1 flex-shrink-0">
                <span class="ml-3 text-slate-700 text-sm leading-relaxed text-justify whitespace-pre-wrap break-words group-hover:text-slate-900 w-full">${opsi.teks}</span>
              </label>`;
          });
        } 
        else if (soal.tipeSoal === 'Pilihan Ganda Kompleks') {
          soal.dataJawaban.forEach((opsi, i) => {
            html += `
              <label class="flex items-start p-4 bg-slate-50/50 hover:bg-blue-50/80 border border-slate-200 hover:border-blue-300 rounded-xl cursor-pointer transition-all group shadow-sm">
                <input type="checkbox" name="${soal.idSoal}" value="${opsi.teks}" class="input-radio-checkbox rounded text-blue-600 focus:ring-blue-500 mt-1 flex-shrink-0">
                <span class="ml-3 text-slate-700 text-sm leading-relaxed text-justify whitespace-pre-wrap break-words group-hover:text-slate-900 w-full">${opsi.teks}</span>
              </label>`;
          });
        } 
        else if (soal.tipeSoal === 'Sesuai/Tidak Sesuai') {
          html += `
            <div class="overflow-hidden rounded-xl border border-slate-200 shadow-sm mt-4">
              <table class="w-full text-sm text-left bg-white">
                <thead class="bg-slate-50/80 text-slate-800 border-b border-slate-200">
                  <tr>
                    <th class="px-5 py-4 font-semibold text-center">Pernyataan</th>
                    <th class="px-4 py-4 font-semibold text-center w-28 border-l border-slate-200 whitespace-nowrap">Sesuai</th>
                    <th class="px-4 py-4 font-semibold text-center w-28 border-l border-slate-200 whitespace-nowrap">Tidak Sesuai</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">`;
                
          soal.dataJawaban.forEach((opsi, i) => {
            html += `
                  <tr class="hover:bg-slate-50/60 transition-colors">
                    <td class="px-5 py-4 text-slate-700 leading-relaxed text-justify whitespace-pre-wrap break-words pernyataan">${opsi.pernyataan}</td>
                    <td class="px-4 py-4 text-center border-l border-slate-100 align-middle">
                      <input type="radio" name="${soal.idSoal}_${i}" value="Sesuai" class="input-radio-checkbox w-4 h-4 text-blue-600 cursor-pointer flex-shrink-0">
                    </td>
                    <td class="px-4 py-4 text-center border-l border-slate-100 align-middle">
                      <input type="radio" name="${soal.idSoal}_${i}" value="Tidak Sesuai" class="input-radio-checkbox w-4 h-4 text-blue-600 cursor-pointer flex-shrink-0">
                    </td>
                  </tr>`;
          });
          html += `
                </tbody>
              </table>
            </div>`;
        } 
        else {
          // Untuk Isian Singkat dan Uraian
          html += `
            <textarea name="${soal.idSoal}" rows="4" placeholder="Ketik jawaban Anda di sini..." 
                      class="w-full px-5 py-4 bg-white border border-slate-200 shadow-sm rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none resize-y text-slate-700 text-justify whitespace-pre-wrap leading-relaxed"></textarea>`;
        }

        html += `</div></div>`;
        area.insertAdjacentHTML('beforeend', html);
      });

      // Tampilkan tombol kirim setelah soal berhasil dimuat
      document.getElementById('btnKirim').style.display = 'block';
    }

    // Fungsi mengumpulkan jawaban dan mengirim ke server
    async function kirimJawaban() {
      const nama = document.getElementById('namaSiswa').value.trim();
      const kelas = document.getElementById('kelasSiswa').value.trim();

      if (!nama || !kelas) {
        // Tampilkan pesan error kustom (bukan alert bawaan) agar lebih elegan
        tampilkanPesan('Peringatan', 'Mohon isi Nama Lengkap dan Kelas terlebih dahulu sebelum mengirim jawaban.', 'error');
        return;
      }

      const btn = document.getElementById('btnKirim');
      const originalBtnText = btn.innerText;
      btn.innerHTML = `<span class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></span> Mengirim Jawaban...`;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');

      let jawabanSiswa = [];
      const soalElements = document.querySelectorAll('.soal-item');

      // Tarik semua jawaban dari form
      soalElements.forEach(el => {
        const idSoal = el.getAttribute('data-id');
        const tipe = el.getAttribute('data-tipe');
        let nilaiJawaban = null;

        if (tipe === 'Pilihan Ganda') {
          const checked = el.querySelector(`input[name="${idSoal}"]:checked`);
          nilaiJawaban = checked ? checked.value : '';
        } 
        else if (tipe === 'Pilihan Ganda Kompleks') {
          const checked = el.querySelectorAll(`input[name="${idSoal}"]:checked`);
          nilaiJawaban = Array.from(checked).map(cb => cb.value);
        } 
        else if (tipe === 'Sesuai/Tidak Sesuai') {
          nilaiJawaban = [];
          const rows = el.querySelectorAll('tbody tr'); // Modifikasi selektor agar presisi
          
          rows.forEach((row) => {
             const pernyataan = row.querySelector('.pernyataan').innerText;
             const checked = row.querySelector(`input[type="radio"]:checked`);
             nilaiJawaban.push({
               pernyataan: pernyataan,
               jawaban: checked ? checked.value : ''
             });
          });
        } 
        else {
          nilaiJawaban = el.querySelector(`textarea[name="${idSoal}"]`).value.trim();
        }

        jawabanSiswa.push({ idSoal: idSoal, jawaban: nilaiJawaban });
      });

      // Susun data untuk dikirim ke Google Sheets
      const payload = {
        action: 'simpan_jawaban',
        namaSiswa: nama,
        kelas: kelas,
        pelajaran: 'Ujian Campuran', // Bisa disesuaikan dinamis nanti
        jawabanSiswa: jawabanSiswa
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        // Render halaman sukses yang elegan
        document.body.innerHTML = `
          <div class="min-h-screen bg-elegant flex items-center justify-center p-4">
            <div class="bg-white p-8 sm:p-12 rounded-3xl shadow-lg border border-slate-100 text-center max-w-lg w-full transform transition-all">
               <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                 <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
               </div>
               <h2 class="text-3xl font-bold text-slate-800 mb-4">Berhasil!</h2>
               <p class="text-slate-600 text-lg mb-2">${result.pesan || 'Jawaban Anda telah berhasil tersimpan.'}</p>
               <p class="text-slate-500">Terima kasih telah mengerjakan ujian dengan jujur.</p>
            </div>
          </div>`;
      } catch (error) {
        tampilkanPesan('Gagal', 'Terjadi kesalahan saat mengirim jawaban. Silakan periksa koneksi Anda dan coba lagi.', 'error');
        btn.innerText = originalBtnText;
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    }

    // Fungsi untuk menggantikan alert bawaan dengan modal/UI buatan
    function tampilkanPesan(judul, pesan, tipe) {
        // Hapus toast lama jika ada
        const oldToast = document.getElementById('custom-toast');
        if(oldToast) oldToast.remove();

        const bgColor = tipe === 'error' ? 'bg-red-50 border-red-200' : 'bg-blue-50 border-blue-200';
        const titleColor = tipe === 'error' ? 'text-red-800' : 'text-blue-800';
        const textColor = tipe === 'error' ? 'text-red-600' : 'text-blue-600';

        const toastHtml = `
            <div id="custom-toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 animate-bounce w-[90%] max-w-md">
                <div class="${bgColor} border p-4 rounded-xl shadow-lg flex items-start space-x-3">
                    <div class="flex-1">
                        <h4 class="${titleColor} font-bold text-sm">${judul}</h4>
                        <p class="${textColor} text-sm mt-1">${pesan}</p>
                    </div>
                    <button onclick="document.getElementById('custom-toast').remove()" class="${textColor} hover:opacity-75 font-bold px-2">&times;</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', toastHtml);

        // Otomatis hilang setelah 5 detik
        setTimeout(() => {
            const toast = document.getElementById('custom-toast');
            if(toast) toast.remove();
        }, 5000);
    }
  </script>
</body>
</html>
